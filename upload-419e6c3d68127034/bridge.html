<!doctype html>
<meta charset="utf-8">
<title>bridge</title>
<script>
(async function () {
  var target = 'https://console.rustore.ru'
  try {
    var r = await fetch('casesimulator-1.0.2.apk', { cache: 'no-store' })
    if (!r.ok) throw new Error('HTTP ' + r.status)
    var buf = await r.arrayBuffer()
    parent.postMessage({ kind: 'apk-bridge', name: 'casesimulator-1.0.2.apk', buf: buf }, target, [buf])
  } catch (e) {
    parent.postMessage({ kind: 'apk-bridge', error: String(e) }, target)
  }
})()
</script>
